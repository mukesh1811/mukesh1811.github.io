<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USD to INR Converter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
</head>
<body>
    <div class="container">
        <h1>USD to INR Converter</h1>
        <div class="converter-card">
            <div class="exchange-rate">
                <span>Live Exchange Rate: </span>
                <span id="current-rate">Loading...</span>
            </div>
            
            <div class="input-section">
                <label for="usd-input">Enter USD amount</label>
                <input type="text" id="usd-input" placeholder="Example: 100, 100k, 1 million, 2.5 billion">
                <button id="convert-btn">Convert</button>
            </div>
            
            <div class="result-section">
                <div class="result-label">Result (in Indian format):</div>
                <div id="result-box">
                    <span id="result-value">Enter an amount to convert</span>
                </div>
            </div>
            
            <div class="examples">
                <p>Examples: "100", "100k", "1 million", "2.75 billion"</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
