name: Update project catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - ghpages-deploy
    paths:
      - 'scripts/generate-projects.mjs'
      - 'projects.js'
      - '.github/workflows/update-project-catalog.yml'

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Check out publishing branch
        uses: actions/checkout@v4
        with:
          ref: ghpages-deploy

      - name: Generate project catalog
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-projects.mjs

      - name: Commit catalog when changed
        run: |
          if git diff --quiet -- projects.json; then
            echo "Project catalog is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git commit -m "Update project catalog"
          git push origin HEAD:ghpages-deploy
